short_bio: >-
  <p>
     Bocheon (Kenny) Gim is a Ph.D. student in Computer Science at the University of Chicago, advised by Prof. Pedro Lopes at the Human Computer Integration Lab. He received his B.S. degree in Electrical Engineering and Computer Science and his M.S. degree in Intelligent Robotics at the Gwangju Institute of Science and Technology. His research lies at the intersection of human-computer interaction, virtual reality, and multisensory interfaces, with a focus on embodied interaction and perceptual augmentation. 
  </p>

